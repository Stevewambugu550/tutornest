<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password - TutorNest</title>
    <link rel="stylesheet" href="../css/creative-design.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--background-light);
        }
        .auth-form-container {
            background: white;
            padding: 3rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .auth-form-container h1 {
            font-size: 28px;
            color: var(--secondary);
            margin-bottom: 1rem;
        }
        .auth-form-container p {
            color: var(--text-light);
            margin-bottom: 2rem;
        }
        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
        }
        .auth-form-container .btn {
            width: 100%;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="auth-form-container">
        <h1>Create a New Password</h1>
        <p>Your new password must be at least 8 characters long.</p>
        <form id="reset-password-form">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required minlength="8">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary">Reset Password</button>
        </form>
    </div>

    <script>
        document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = e.target.password.value;
            const confirmPassword = e.target.confirmPassword.value;
            const button = e.target.querySelector('button');

            if (password !== confirmPassword) {
                return alert('Passwords do not match.');
            }

            // Get the reset token from the URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                return alert('Invalid or missing reset token.');
            }

            button.disabled = true;
            button.textContent = 'Resetting...';

            try {
                const response = await fetch('http://localhost:4000/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Success! Your password has been reset. You can now log in with your new password.');
                    window.location.href = 'login.html';
                } else {
                    throw new Error(data.message || 'Failed to reset password.');
                }
            } catch (err) {
                alert('Error: ' + err.message);
                button.disabled = false;
                button.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
