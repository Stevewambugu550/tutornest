<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - TutorNest</title>
    <link rel="stylesheet" href="../css/creative-design.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--background-light);
        }
        .auth-form-container {
            background: white;
            padding: 3rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .auth-form-container h1 {
            font-size: 28px;
            color: var(--secondary);
            margin-bottom: 1rem;
        }
        .auth-form-container p {
            color: var(--text-light);
            margin-bottom: 2rem;
        }
        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
        }
        .auth-form-container .btn {
            width: 100%;
            margin-top: 1rem;
        }
        .back-to-login {
            margin-top: 2rem;
            color: var(--text-light);
        }
        .back-to-login a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="auth-form-container">
        <h1>Forgot Your Password?</h1>
        <p>No problem. Enter your email address below and we'll send you a link to reset it.</p>
        <form id="forgot-password-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>
            <button type="submit" class="btn btn-primary">Send Reset Link</button>
        </form>
        <div class="back-to-login">
            <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Log In</a>
        </div>
    </div>

    <script>
        document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = e.target.email.value;
            const button = e.target.querySelector('button');
            button.disabled = true;
            button.textContent = 'Sending...';

            try {
                // This will call our REAL backend
                const response = await fetch('http://localhost:4000/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Success! If an account with that email exists, a password reset link has been sent. (Check the backend terminal for the link).');
                    e.target.innerHTML = `<p style="color: var(--success);">A reset link has been sent to your email address.</p>`;
                } else {
                    throw new Error(data.message || 'Something went wrong.');
                }
            } catch (err) {
                alert('Error: ' + err.message);
                button.disabled = false;
                button.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
