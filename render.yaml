services:
  - type: web
    name: roar-east-africa-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node roar-server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ROAR_CLIENT_URL
        value: https://roar-east-africa.netlify.app
      - key: ROAR_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGSSLMODE
        value: require
