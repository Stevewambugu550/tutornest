# Netlify Configuration File for TutorNest

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/*"
  to = "https://api.tutornest.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tutors"
  to = "/#tutors"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/#pricing"
  status = 200

[[redirects]]
  from = "/subjects"
  to = "/#subjects"
  status = 200
